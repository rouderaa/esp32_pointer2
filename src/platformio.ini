; PlatformIO Configuration for TTGO T7 v1.3 (ESP32)
; Board: LilyGO TTGO T7 v1.3 (Mini32 / ESP32 WROVER-B)

[env:ttgo-t7-v13]
platform  = espressif32@6.3.2
board     = esp32dev
framework = arduino

; Serial / upload settings
monitor_speed  = 115200
monitor_port = /dev/ttyUSB1
upload_speed   = 921600
upload_port = /dev/ttyUSB1

; Board-specific build flags
build_flags =
    -DBOARD_HAS_PSRAM          ; T7 v1.3 includes 4 MB PSRAM (WROVER-B module)
    -mfix-esp32-psram-cache-issue
    -DARDUINO_ESP32_DEV
    -DARDUINO_USB_CDC_ON_BOOT=0  ; Fix: suppresses Serial1 undefined reference

; Partition scheme — 4 MB flash (default), with OTA support
board_build.partitions = default.csv

; Optional: increase stack size if using PSRAM-heavy tasks
; board_build.f_cpu = 240000000L
; board_build.f_flash = 80000000L
; board_build.flash_mode = dio

; Library dependencies
lib_deps =
    budryerson/TFMPlus
    https://github.com/pschatzmann/ESP32-A2DP
    https://github.com/pschatzmann/arduino-audio-tools.git
